name: External link health

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check first-party links
        run: npm run check:links
        env:
          LINK_CHECK_SCOPE: first-party
      - name: Check third-party links (advisory)
        continue-on-error: true
        run: npm run check:links
        env:
          LINK_CHECK_SCOPE: third-party
